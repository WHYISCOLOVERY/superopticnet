name: superoptic_ops
description: "SuperOptic Carrier-Grade ISP Operations, Fleet Tracking & Field Dispatch Mobile App"
publish_to: "none"
version: 1.0.2+3

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Networking & Security
  dio: ^5.4.1
  flutter_secure_storage: ^9.0.0
  crypto: ^3.0.3

  # Local Relational DB & Offline-First (SQLite)
  sqlite3_flutter_libs: ^0.5.20
  sqlite3: ^2.4.0
  path_provider: ^2.1.2
  path: ^1.9.0

  # Background Geolocation & Map
  geolocator: ^11.0.0
  flutter_background_service: ^5.0.5
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Camera, Watermark & On-Device ML OCR
  camera: ^0.10.5+9
  image_picker: ^1.0.7
  image: ^4.1.7
  google_mlkit_text_recognition: ^0.17.1

  # Utilities & UI
  uuid: ^4.3.3
  intl: ^0.20.3
  battery_plus: ^7.1.1
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/maps/
    - assets/images/
