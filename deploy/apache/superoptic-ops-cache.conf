# Flutter's shell and service-worker metadata must be revalidated so Safari and
# installed PWAs discover a new release immediately after the /ops symlink is
# switched. Fingerprinted assets may remain cached for one day.
<LocationMatch "^/ops/(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json|manifest\.json)$">
    Header always set Cache-Control "no-cache, no-store, must-revalidate"
    Header always set Pragma "no-cache"
    Header always set Expires "0"
</LocationMatch>

<LocationMatch "^/ops/(assets|canvaskit|icons)/">
    Header always set Cache-Control "public, max-age=86400"
</LocationMatch>
