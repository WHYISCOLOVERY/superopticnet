<VirtualHost *:80>
    ServerName mgt.superoptic.net
    ServerAlias 85.132.57.222 192.168.100.201 localhost 127.0.0.1
    DocumentRoot /var/www/superopticnet
    IncludeOptional /etc/apache2/superoptic-force-https.conf

    <Directory /var/www/superopticnet>
        AllowOverride All
        Options -Indexes
        Require all granted
    </Directory>

    <Directory /var/www/superopticnet/data>
        Require all denied
    </Directory>

    <Directory /var/www/superopticnet/tmp>
        Require all denied
    </Directory>

    <DirectoryMatch "/var/www/superopticnet/(?:\.git|\.ai-collaboration|\.claude|\.tools|config|db|docs|deploy|graphify-out|output|tmp|data|whatsapp-bridge)">
        Require all denied
    </DirectoryMatch>

    <FilesMatch "(^\.|config\.local\.php$|config\.php\.(bak|old|orig|swp)$|\.env(?:\..*)?|\.(log|sql|bak|old|orig|swp)$)">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/superoptic-error.log
    CustomLog ${APACHE_LOG_DIR}/superoptic-access.log combined
</VirtualHost>
