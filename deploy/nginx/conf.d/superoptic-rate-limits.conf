limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
# Nginx OSS supports r/s and r/m rates. OTP uses 1r/m with burst=2 in locations,
# which approximates 3 requests per 5 minutes without invalid rate syntax.
limit_req_zone $binary_remote_addr zone=otp_limit:10m rate=1r/m;
limit_req_zone $binary_remote_addr zone=provider_api_limit:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=public_api_limit:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=diagnostics_limit:10m rate=20r/m;

limit_conn_zone $binary_remote_addr zone=per_ip_conn:10m;
