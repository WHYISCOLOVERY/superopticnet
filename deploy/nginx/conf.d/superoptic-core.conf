server_tokens off;
charset utf-8;

log_format superoptic_json escape=json
    '{'
    '"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"x_forwarded_for":"$http_x_forwarded_for",'
    '"host":"$host",'
    '"request":"$request",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"upstream_response_time":"$upstream_response_time",'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent"'
    '}';

access_log /var/log/nginx/superoptic-access.log superoptic_json;
error_log /var/log/nginx/superoptic-error.log warn;

client_max_body_size 20m;
client_body_timeout 15s;
client_header_timeout 15s;
send_timeout 30s;
reset_timedout_connection on;

gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml
    application/rss+xml
    image/svg+xml;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $http_user_agent $blocked_agent {
    default 0;
    ~*(?:sqlmap|nikto|nmap|masscan|dirbuster|gobuster|acunetix|nessus) 1;
}
