server {
    listen 80;
    listen [::]:80;
    server_name
        mgs.superoptic.net
        billing.superoptic.net
        api.superoptic.net
        status.superoptic.net;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mgs.superoptic.net;

    ssl_certificate /etc/letsencrypt/live/mgs.superoptic.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mgs.superoptic.net/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;
    include /etc/nginx/snippets/security-headers.conf;

    limit_conn per_ip_conn 30;

    if ($blocked_agent) {
        return 444;
    }

    # Optional office/VPN restriction. Add real IPs in
    # conf.d/superoptic-access-control.conf, then uncomment this block.
    # if ($office_or_vpn_allowed = 0) {
    #     return 403;
    # }

    location = /api/health {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://mgs_php_frontend/api/health.php;
    }

    location ~ ^/api/(billing|radius|noc|olt|diagnostics|crm|inventory|notification|mgs)$ {
        return 308 $scheme://$host$uri/;
    }

    location = /staff-login.php {
        limit_req zone=login_limit burst=5 nodelay;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://mgs_php_frontend;
    }

    location ~* ^/(portal-login|cabinet-login|mygov-auth)\.php$ {
        limit_req zone=login_limit burst=5 nodelay;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://mgs_php_frontend;
    }

    location / {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://mgs_php_frontend;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name billing.superoptic.net;

    ssl_certificate /etc/letsencrypt/live/billing.superoptic.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/billing.superoptic.net/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;
    include /etc/nginx/snippets/security-headers.conf;

    limit_conn per_ip_conn 40;

    if ($blocked_agent) {
        return 444;
    }

    location = /api/health {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://customer_portal/api/health.php;
    }

    location /api/provider/ {
        # Enable strict provider IP whitelist before production payment cutover.
        # if ($provider_api_allowed = 0) {
        #     return 403;
        # }
        limit_req zone=provider_api_limit burst=30 nodelay;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://customer_portal;
    }

    location = /staff-login.php {
        # Optional office/VPN restriction for internal employee login.
        # Add real trusted IPs in conf.d/superoptic-access-control.conf,
        # then uncomment the block below.
        # if ($office_or_vpn_allowed = 0) {
        #     return 403;
        # }
        limit_req zone=login_limit burst=5 nodelay;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://customer_portal;
    }

    location ~* ^/(portal-login|cabinet-login|mygov-auth)\.php$ {
        limit_req zone=login_limit burst=5 nodelay;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://customer_portal;
    }

    location / {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://customer_portal;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.superoptic.net;

    ssl_certificate /etc/letsencrypt/live/api.superoptic.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.superoptic.net/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;
    include /etc/nginx/snippets/security-headers.conf;

    limit_conn per_ip_conn 80;

    if ($blocked_agent) {
        return 444;
    }

    location = /api/health {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://mgs_php_frontend/api/health.php;
    }

    location /api/billing/ {
        if ($provider_api_allowed = 0) {
            return 403;
        }
        limit_req zone=provider_api_limit burst=60 nodelay;
        rewrite ^/api/billing/?(.*)$ /$1 break;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://billing_service;
    }

    location /api/radius/ {
        if ($provider_api_allowed = 0) {
            return 403;
        }
        limit_req zone=provider_api_limit burst=60 nodelay;
        rewrite ^/api/radius/?(.*)$ /$1 break;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://radius_service;
    }

    location /api/noc/ {
        limit_req zone=public_api_limit burst=30 nodelay;
        rewrite ^/api/noc/?(.*)$ /$1 break;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://noc_service;
    }

    location /api/olt/ {
        limit_req zone=public_api_limit burst=30 nodelay;
        rewrite ^/api/olt/?(.*)$ /$1 break;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://olt_service;
    }

    location /api/diagnostics/ {
        limit_req zone=diagnostics_limit burst=10 nodelay;
        rewrite ^/api/diagnostics/?(.*)$ /$1 break;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://diagnostics_service;
    }

    location /api/crm/ {
        limit_req zone=public_api_limit burst=30 nodelay;
        rewrite ^/api/crm/?(.*)$ /$1 break;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://crm_service;
    }

    location /api/inventory/ {
        limit_req zone=public_api_limit burst=30 nodelay;
        rewrite ^/api/inventory/?(.*)$ /$1 break;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://inventory_service;
    }

    location /api/notification/ {
        if ($provider_api_allowed = 0) {
            return 403;
        }
        limit_req zone=provider_api_limit burst=60 nodelay;
        rewrite ^/api/notification/?(.*)$ /$1 break;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://notification_service;
    }

    location /api/notification/otp/ {
        if ($provider_api_allowed = 0) {
            return 403;
        }
        limit_req zone=otp_limit burst=2 nodelay;
        rewrite ^/api/notification/otp/?(.*)$ /otp/$1 break;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://notification_service;
    }

    location /api/mgs/ {
        limit_req zone=public_api_limit burst=30 nodelay;
        rewrite ^/api/mgs/?(.*)$ /api/$1 break;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://mgs_php_frontend;
    }

    location /ws/ {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_pass http://websocket_service;
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name status.superoptic.net;

    ssl_certificate /etc/letsencrypt/live/status.superoptic.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/status.superoptic.net/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;
    include /etc/nginx/snippets/security-headers.conf;

    location = /api/health {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://mgs_php_frontend/api/health.php;
    }

    location = /api/health.php {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://mgs_php_frontend/api/health.php;
    }

    location = / {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://mgs_php_frontend/status.php;
    }

    location = /status.php {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://mgs_php_frontend/status.php;
    }
}
